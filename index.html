<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A Very Important Question</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0a1e;
      --card: #1a1230;
      --card-border: #3d2d6e;
      --yes: #ff6b9d;
      --yes-hover: #ff4785;
      --no: #5de8d0;
      --no-hover: #38d4ba;
      --text: #f5f0ff;
      --sub: #a89bcf;
      --gold: #ffd166;
      --star: #c9b8ff;
    }

    body {
      font-family: 'Nunito', sans-serif;
      background-color: var(--bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* ── Starfield ── */
    .stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }
    .star {
      position: absolute;
      border-radius: 50%;
      background: var(--star);
      animation: twinkle var(--d, 3s) ease-in-out infinite alternate;
      opacity: 0;
    }
    @keyframes twinkle {
      0%   { opacity: 0; transform: scale(0.6); }
      100% { opacity: var(--o, 0.7); transform: scale(1); }
    }

    /* ── Floating dots background ── */
    .bg-dots {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background-image:
        radial-gradient(circle, rgba(255,107,157,0.08) 1px, transparent 1px),
        radial-gradient(circle, rgba(93,232,208,0.06) 1px, transparent 1px);
      background-size: 48px 48px, 72px 72px;
      background-position: 0 0, 24px 24px;
    }

    /* ── Card ── */
    .card {
      position: relative;
      z-index: 10;
      background: var(--card);
      border: 2px solid var(--card-border);
      border-radius: 32px;
      padding: 64px 72px;
      text-align: center;
      box-shadow:
        0 0 0 1px rgba(93,232,208,0.06),
        0 32px 80px rgba(0,0,0,0.5),
        0 0 80px rgba(255,107,157,0.07) inset;
      max-width: 520px;
      width: 90%;
      animation: float 5s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50%       { transform: translateY(-10px); }
    }

    .card-emoji {
      font-size: 3rem;
      display: block;
      margin-bottom: 16px;
      animation: wiggle 2.4s ease-in-out infinite;
    }
    @keyframes wiggle {
      0%, 100% { transform: rotate(-6deg) scale(1); }
      50%       { transform: rotate(6deg) scale(1.12); }
    }

    h1 {
      font-family: 'Fredoka One', cursive;
      font-size: clamp(2rem, 5vw, 2.8rem);
      color: var(--text);
      letter-spacing: 0.5px;
      line-height: 1.2;
      margin-bottom: 10px;
    }
    h1 span { color: var(--gold); }

    .subtitle {
      color: var(--sub);
      font-size: 0.95rem;
      margin-bottom: 48px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    /* ── Buttons ── */
    .btn-row {
      display: flex;
      gap: 20px;
      justify-content: center;
      align-items: center;
    }

    .btn {
      font-family: 'Fredoka One', cursive;
      font-size: 1.4rem;
      padding: 16px 48px;
      border: none;
      border-radius: 100px;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
      letter-spacing: 0.5px;
      outline: none;
    }

    .btn-yes {
      background: var(--yes);
      color: #fff;
      box-shadow: 0 8px 24px rgba(255,107,157,0.45);
    }
    .btn-yes:hover {
      background: var(--yes-hover);
      transform: scale(1.07) translateY(-2px);
      box-shadow: 0 12px 32px rgba(255,107,157,0.6);
    }
    .btn-yes:active {
      transform: scale(0.97);
    }

    .btn-no {
      background: var(--no);
      color: #0f0a1e;
      box-shadow: 0 6px 18px rgba(93,232,208,0.4);
      position: fixed;
      font-size: 0.95rem;
      padding: 10px 28px;
      pointer-events: auto;
      z-index: 9999;
      display: block;
    }

    /* ── Celebration Overlay ── */
    #celebration {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(10, 6, 28, 0.92);
      backdrop-filter: blur(6px);
    }
    #celebration.show { display: flex; }

    #confetti-canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 999;
      display: none;
    }
    #confetti-canvas.active { display: block; }

    .celebrate-card {
      position: relative;
      z-index: 1001;
      text-align: center;
      animation: popIn 0.6s cubic-bezier(0.34,1.56,0.64,1) both;
    }
    @keyframes popIn {
      from { opacity: 0; transform: scale(0.4) rotate(-8deg); }
      to   { opacity: 1; transform: scale(1) rotate(0deg); }
    }

    .celebrate-emoji {
      font-size: 5rem;
      display: block;
      margin-bottom: 20px;
      animation: bounce 0.8s ease-in-out infinite alternate;
    }
    @keyframes bounce {
      from { transform: translateY(0) rotate(-5deg) scale(1); }
      to   { transform: translateY(-20px) rotate(5deg) scale(1.1); }
    }

    .celebrate-title {
      font-family: 'Fredoka One', cursive;
      font-size: clamp(2.8rem, 8vw, 5rem);
      color: var(--gold);
      text-shadow:
        0 0 20px rgba(255,209,102,0.6),
        0 0 60px rgba(255,209,102,0.3);
      line-height: 1.1;
      margin-bottom: 16px;
    }

    .celebrate-sub {
      font-family: 'Fredoka One', cursive;
      font-size: clamp(1.6rem, 4vw, 2.4rem);
      color: var(--yes);
      text-shadow: 0 0 30px rgba(255,107,157,0.5);
      margin-bottom: 40px;
    }

    .celebrate-btn {
      font-family: 'Fredoka One', cursive;
      font-size: 1.1rem;
      padding: 14px 40px;
      background: var(--gold);
      color: #0f0a1e;
      border: none;
      border-radius: 100px;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(255,209,102,0.4);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .celebrate-btn:hover {
      transform: scale(1.06) translateY(-2px);
      box-shadow: 0 12px 32px rgba(255,209,102,0.6);
    }

    /* ── Hacker Screen ── */
    #hacker {
      position: fixed;
      inset: 0;
      z-index: 2000;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #000;
    }
    #hacker.show { display: flex; }

    #matrix-canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 2001;
      opacity: 0.45;
    }

    .hacker-card {
      position: relative;
      z-index: 2002;
      text-align: center;
      animation: glitchIn 0.5s cubic-bezier(0.34,1.56,0.64,1) both;
    }
    @keyframes glitchIn {
      0%   { opacity: 0; transform: scale(1.3) skewX(10deg); filter: blur(8px); }
      60%  { filter: blur(0px); }
      100% { opacity: 1; transform: scale(1) skewX(0deg); }
    }

    .hacker-label {
      font-family: 'Nunito', monospace;
      font-size: 0.75rem;
      font-weight: 900;
      letter-spacing: 0.3em;
      color: #0f0;
      text-transform: uppercase;
      margin-bottom: 24px;
      animation: blink 1s step-end infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0; }
    }

    .hacker-title {
      font-family: 'Fredoka One', cursive;
      font-size: clamp(3rem, 10vw, 6rem);
      color: #fff;
      line-height: 1;
      margin-bottom: 28px;
      text-shadow: 0 0 30px rgba(0,255,0,0.3);
      animation: glitchText 2s infinite;
    }
    .hacker-title span {
      color: #0f0;
      text-shadow:
        0 0 10px #0f0,
        0 0 40px rgba(0,255,0,0.5);
    }
    @keyframes glitchText {
      0%, 90%, 100% { transform: none; }
      92% { transform: skewX(-4deg) translateX(4px); color: #f00; }
      94% { transform: skewX(4deg) translateX(-4px); color: #0ff; }
      96% { transform: none; }
    }

    .hacker-sub {
      font-family: 'Nunito', sans-serif;
      font-size: 1rem;
      color: #5de8d0;
      margin-bottom: 32px;
      line-height: 1.7;
    }

    .hacker-badge {
      display: inline-block;
      font-family: 'Nunito', monospace;
      font-size: 0.85rem;
      font-weight: 900;
      letter-spacing: 0.15em;
      color: #000;
      background: #0f0;
      padding: 10px 24px;
      border-radius: 4px;
      animation: badgePulse 1.5s ease-in-out infinite alternate;
    }
    @keyframes badgePulse {
      from { box-shadow: 0 0 10px #0f0, 0 0 20px #0f0; }
      to   { box-shadow: 0 0 20px #0f0, 0 0 60px rgba(0,255,0,0.4); }
    }

    /* ── Floating emojis ── */
    .emoji-float {
      position: fixed;
      font-size: 2rem;
      pointer-events: none;
      animation: floatUp var(--dur, 3s) ease-out forwards;
      z-index: 1003;
    }
    @keyframes floatUp {
      0%   { transform: translateY(0) rotate(0deg) scale(1); opacity: 1; }
      100% { transform: translateY(-110vh) rotate(360deg) scale(0.5); opacity: 0; }
    }
  </style>
</head>
<body>

  <!-- Starfield -->
  <div class="stars" id="stars"></div>
  <div class="bg-dots"></div>

  <!-- Main card -->
  <div class="card" id="mainCard">
    <span class="card-emoji">🎂</span>
    <h1>Alex, are you <span>Gay</span>?</h1>
    <p class="subtitle">Think very carefully before answering</p>
    <div class="btn-row">
      <button class="btn btn-yes" id="yesBtn">Yes!</button>
    </div>
  </div>

  <button class="btn btn-no" id="noBtn">No...</button>

  <!-- Hacker screen -->
  <div id="hacker">
    <canvas id="matrix-canvas"></canvas>
    <div class="hacker-card">
      <div class="hacker-label">INTRUSION DETECTED</div>
      <div class="hacker-title">ALEX IS<br/><span>A HACKER</span></div>
      <div class="hacker-sub">Only a true hacker clicks the impossible button.<br/>We see you, Alex. 👁️</div>
      <div class="hacker-badge">🕵️ ELITE DEVTOOLS USER 🕵️</div>
    </div>
  </div>

  <canvas id="confetti-canvas"></canvas>

  <!-- Celebration overlay -->
  <div id="celebration">
    <div class="celebrate-card">
      <span class="celebrate-emoji">🎉</span>
      <div class="celebrate-title">Happy Birthday!</div>
      <div class="celebrate-sub">We knew it was you, Alex! 🥳</div>
      <button class="celebrate-btn" id="replayBtn">🎊 Again! 🎊</button>
    </div>
  </div>

  <script>
    /* ─── Starfield ─── */
    const starsEl = document.getElementById('stars');
    for (let i = 0; i < 120; i++) {
      const s = document.createElement('div');
      s.className = 'star';
      const size = Math.random() * 2.5 + 0.5;
      s.style.cssText = `
        width:${size}px; height:${size}px;
        left:${Math.random()*100}%;
        top:${Math.random()*100}%;
        --d:${(Math.random()*3+1.5).toFixed(1)}s;
        --o:${(Math.random()*0.6+0.2).toFixed(2)};
        animation-delay:${(Math.random()*4).toFixed(1)}s;
      `;
      starsEl.appendChild(s);
    }

    /* ─── No button: place initially, then flee ─── */
    const noBtn = document.getElementById('noBtn');
    const FLEE_RADIUS = 160;

    function randomPos() {
      const w = noBtn.offsetWidth  || 100;
      const h = noBtn.offsetHeight || 44;
      const margin = 20;
      return {
        x: Math.random() * (window.innerWidth  - w - margin * 2) + margin,
        y: Math.random() * (window.innerHeight - h - margin * 2) + margin
      };
    }

    function placeNoBtn(x, y) {
      const w = noBtn.offsetWidth  || 100;
      const h = noBtn.offsetHeight || 44;
      const clampedX = Math.max(10, Math.min(x, window.innerWidth  - w - 10));
      const clampedY = Math.max(10, Math.min(y, window.innerHeight - h - 10));
      noBtn.style.left = clampedX + 'px';
      noBtn.style.top  = clampedY + 'px';
    }

    // Place it next to Yes button immediately
    const yesRect = document.getElementById('yesBtn').getBoundingClientRect();
    placeNoBtn(yesRect.right + 24, yesRect.top);

    let fleeCooldown = false;
    document.addEventListener('mousemove', (e) => {
      if (fleeCooldown) return;
      const rect = noBtn.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top  + rect.height / 2;
      const dist = Math.hypot(e.clientX - cx, e.clientY - cy);
      if (dist < FLEE_RADIUS) {
        fleeCooldown = true;
        const p = randomPos();
        placeNoBtn(p.x, p.y);
        setTimeout(() => { fleeCooldown = false; }, 80);
      }
    });

    // Also flee on touch (mobile)
    document.addEventListener('touchmove', (e) => {
      const t = e.touches[0];
      const rect = noBtn.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top  + rect.height / 2;
      const dist = Math.hypot(t.clientX - cx, t.clientY - cy);
      if (dist < FLEE_RADIUS) {
        const p = randomPos();
        placeNoBtn(p.x, p.y);
      }
    });

    // Only hackermen reach here
    noBtn.addEventListener('click', (e) => {
      e.preventDefault();
      document.getElementById('hacker').classList.add('show');
      startGlitch();
    });

    /* ─── Yes button → Celebration ─── */
    document.getElementById('yesBtn').addEventListener('click', () => {
      document.getElementById('celebration').classList.add('show');
      launchConfetti();
      spawnFloatingEmojis();
    });

    document.getElementById('replayBtn').addEventListener('click', () => {
      // Stop confetti
      if (animId) { cancelAnimationFrame(animId); animId = null; }
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      canvas.classList.remove('active');
      particles = [];
      // Hide celebration, show main card
      document.getElementById('celebration').classList.remove('show');
      document.getElementById('mainCard').style.display = '';
      // Re-place No button
      const yr = document.getElementById('yesBtn').getBoundingClientRect();
      placeNoBtn(yr.right + 24, yr.top);
    });

    /* ─── Confetti ─── */
    const canvas = document.getElementById('confetti-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    let animId = null;

    const COLORS = ['#ff6b9d','#ffd166','#5de8d0','#c9b8ff','#ff9f43','#a29bfe','#fd79a8','#55efc4'];

    function resizeCanvas() {
      canvas.width  = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    function makeParticle() {
      return {
        x: Math.random() * canvas.width,
        y: -10,
        w: Math.random() * 10 + 5,
        h: Math.random() * 6 + 3,
        color: COLORS[Math.floor(Math.random() * COLORS.length)],
        vx: (Math.random() - 0.5) * 4,
        vy: Math.random() * 4 + 2,
        rot: Math.random() * 360,
        rSpeed: (Math.random() - 0.5) * 8,
        alpha: 1,
        shape: Math.random() < 0.4 ? 'circle' : 'rect'
      };
    }

    function launchConfetti() {
      if (animId) cancelAnimationFrame(animId);
      canvas.classList.add('active');
      particles = [];
      for (let i = 0; i < 220; i++) {
        const p = makeParticle();
        p.y = Math.random() * canvas.height * 0.6;
        particles.push(p);
      }
      animateConfetti();
    }

    function animateConfetti() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      // Drip in new ones
      if (particles.length < 350 && Math.random() < 0.5) {
        particles.push(makeParticle());
      }

      particles.forEach((p, i) => {
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot * Math.PI / 180);
        ctx.globalAlpha = p.alpha;
        ctx.fillStyle = p.color;
        if (p.shape === 'circle') {
          ctx.beginPath();
          ctx.arc(0, 0, p.w / 2, 0, Math.PI * 2);
          ctx.fill();
        } else {
          ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        }
        ctx.restore();

        p.x   += p.vx;
        p.y   += p.vy;
        p.vy  += 0.06; // gravity
        p.rot += p.rSpeed;

        if (p.y > canvas.height - 50) {
          p.alpha -= 0.03;
        }
      });

      particles = particles.filter(p => p.alpha > 0.05);
      if (particles.length > 0) {
        animId = requestAnimationFrame(animateConfetti);
      } else {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
    }

    /* ─── Floating emoji shower ─── */
    const PARTY_EMOJIS = ['🎉','🎊','🎂','🥳','🎁','✨','🌟','💫','🎈','❤️','🍰','🪄'];
    function spawnFloatingEmojis() {
      for (let i = 0; i < 20; i++) {
        setTimeout(() => {
          const el = document.createElement('div');
          el.className = 'emoji-float';
          el.textContent = PARTY_EMOJIS[Math.floor(Math.random() * PARTY_EMOJIS.length)];
          el.style.cssText = `
            left: ${Math.random() * 90 + 5}%;
            bottom: -60px;
            font-size: ${Math.random() * 1.5 + 1.5}rem;
            --dur: ${(Math.random() * 2 + 2.5).toFixed(1)}s;
          `;
          document.body.appendChild(el);
          el.addEventListener('animationend', () => el.remove());
        }, i * 120);
      }
    }

    /* ─── Matrix Rain ─── */
    const mCanvas = document.getElementById('matrix-canvas');
    const mCtx = mCanvas.getContext('2d');
    let matrixId = null;

    function startGlitch() {
      mCanvas.width  = window.innerWidth;
      mCanvas.height = window.innerHeight;
      const cols = Math.floor(mCanvas.width / 16);
      const drops = Array(cols).fill(1);
      const chars = 'アイウエオカキクケコサシスセソタチツテトナニヌネノ01アBCDEF<>{}[]01';

      if (matrixId) cancelAnimationFrame(matrixId);

      function draw() {
        mCtx.fillStyle = 'rgba(0,0,0,0.05)';
        mCtx.fillRect(0, 0, mCanvas.width, mCanvas.height);
        mCtx.fillStyle = '#0f0';
        mCtx.font = '14px monospace';
        drops.forEach((y, i) => {
          const ch = chars[Math.floor(Math.random() * chars.length)];
          mCtx.fillText(ch, i * 16, y * 16);
          if (y * 16 > mCanvas.height && Math.random() > 0.975) drops[i] = 0;
          drops[i]++;
        });
        matrixId = requestAnimationFrame(draw);
      }
      draw();
    }
  </script>
</body>
</html>
